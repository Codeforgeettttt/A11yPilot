name: Docker branch checks

on:
  push:
    branches:
      - Docker
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-checks:
    name: Node tests and quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npm run format:check

      - name: Run automated tests
        if: success() || failure()
        run: npm test

      - name: Build frontend
        if: success() || failure()
        run: npm run build

  docker-build:
    name: Docker images and demo smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        env:
          MSSQL_SA_PASSWORD: 'CiOnly_Example123!'
        run: docker compose -f docker-compose.yml config --quiet

      - name: Build application images
        run: docker compose -f docker-compose.yml build backend frontend

      - name: Start demo frontend
        run: docker compose -f compose.demo.yaml up --build -d

      - name: Check demo HTTP response
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:5174/ > /dev/null; then
              echo "Demo frontend is responding"
              exit 0
            fi
            sleep 2
          done
          docker compose -f compose.demo.yaml logs
          exit 1

      - name: Show demo container logs on failure
        if: failure()
        run: docker compose -f compose.demo.yaml logs

      - name: Stop demo container
        if: always()
        run: docker compose -f compose.demo.yaml down --remove-orphans
