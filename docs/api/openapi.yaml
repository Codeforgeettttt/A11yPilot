openapi: 3.0.3
info:
  title: A11yPilot API
  version: 1.0.0
  description: API de A11yPilot. Análisis de accesibilidad reales con Playwright y axe-core (WCAG 2.2 A y AA), y análisis simulados para el modo de prueba.
servers:
  - url: http://127.0.0.1:3001/api
paths:
  /auth/register:
    post:
      summary: Crear cuenta y sesión
      responses:
        '201': {description: Cuenta creada}
  /auth/login:
    post:
      summary: Iniciar sesión
      responses:
        '200': {description: Sesión iniciada}
  /auth/me:
    get:
      summary: Perfil del usuario
      responses:
        '200': {description: Perfil propio}
    patch:
      summary: Actualizar nombre de perfil
      responses:
        '200': {description: Actualizado}
  /auth/logout:
    post:
      summary: Cerrar sesión
      responses:
        '204': {description: Sesión cerrada}
  /auth/change-password:
    post:
      summary: Cambiar contraseña
      responses:
        '200': {description: Actualizada}
  /auth/forgot-password:
    post:
      summary: Solicitar recuperación
      responses:
        '200': {description: Respuesta genérica}
  /auth/reset-password:
    post:
      summary: Restablecer contraseña
      responses:
        '200': {description: Actualizada}
  /health:
    get:
      summary: Estado del servicio
      responses:
        '200': { description: Servicio disponible }
  /health/database:
    get:
      summary: Estado de SQL Server
      responses:
        '200': { description: Conexion correcta }
        '500': { description: Error de conexion }
  /dashboard/summary:
    get:
      summary: Indicadores del dashboard
      responses:
        '200': { description: Resumen de registros }
  /projects:
    get:
      summary: Listar proyectos
      responses:
        '200': { description: Proyectos encontrados }
    post:
      summary: Crear proyecto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 3, maxLength: 120 }
                description: { type: string, maxLength: 700 }
      responses:
        '201': { description: Proyecto creado }
        '400': { description: Validacion fallida }
  /projects/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      summary: Consultar proyecto
      responses:
        '200': { description: Proyecto encontrado }
        '404': { description: No existe }
    patch:
      summary: Actualizar proyecto
      responses:
        '200': { description: Proyecto actualizado }
    delete:
      summary: Eliminar proyecto
      responses:
        '204': { description: Eliminado }
  /projects/{id}/sites:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      summary: Listar sitios de un proyecto
      responses:
        '200': { description: Sitios encontrados }
    post:
      summary: Registrar sitio autorizado
      responses:
        '201': { description: Sitio registrado }
  /sites:
    get:
      summary: Listar sitios
      responses:
        '200': { description: Sitios registrados }
  /sites/{id}:
    delete:
      summary: Eliminar sitio
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '204': { description: Sitio eliminado }
    patch:
      summary: Editar nombre y URL de un sitio
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                url: { type: string, format: uri }
                authorizationConfirmed:
                  type: boolean
                  description: Obligatorio (true) si cambia la URL
      responses:
        '200': { description: Sitio actualizado }
        '400': { description: Datos no válidos o falta confirmar la autorización de la nueva URL }
        '404': { description: El sitio no existe o no pertenece al usuario }
  /analyses:
    get:
      summary: Historial de análisis
      responses:
        '200': { description: Análisis registrados }
    post:
      summary: Pedir un análisis real con Playwright y axe-core (se ejecuta en segundo plano)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [siteId, authorizationConfirmed]
              properties:
                siteId: { type: integer }
                authorizationConfirmed: { type: boolean, enum: [true] }
      responses:
        '202': { description: 'Análisis aceptado en estado En cola; consultar /analyses/{id}/status' }
        '400': { description: Falta confirmar la autorización }
        '404': { description: El sitio no existe o no pertenece al usuario }
        '409': { description: El usuario ya tiene un análisis en curso }
  /analyses/demo:
    post:
      summary: Crear analisis simulado (sin acceder a la URL)
      responses:
        '201': { description: Analisis de demostracion registrado }
  /analyses/{id}:
    get:
      summary: Consultar analisis y hallazgos
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Analisis encontrado }
  /analyses/{id}/status:
    get:
      summary: Estado de un análisis (el frontend lo consulta cada pocos segundos)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Estado, número de hallazgos y eventos (En cola → Ejecutándose → Completado o Fallido)
        '404': { description: El análisis no existe o no pertenece al usuario }
  /findings:
    get:
      summary: Consultar hallazgos
      parameters:
        - { in: query, name: impact, schema: { type: string } }
        - { in: query, name: status, schema: { type: string } }
      responses:
        '200': { description: Hallazgos encontrados }
  /findings/{id}/status:
    patch:
      summary: Actualizar estado y observacion de seguimiento
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Estado actualizado }
  /findings/{id}/updates:
    get:
      summary: Historial de cambios de un hallazgo
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Historial encontrado }
  /reports/{analysisId}:
    get:
      summary: Descargar el informe PDF de un análisis (indica si es simulado)
      parameters:
        - in: path
          name: analysisId
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Informe PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
